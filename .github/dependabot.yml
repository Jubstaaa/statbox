version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: compromised versions are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
      # react and react-dom refuse to run at different versions.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    ignore:
      # `typescript` is the TypeScript 6 API package (@typescript/typescript6)
      # that eslint-config-next and next build load; TypeScript 7 itself updates
      # through @typescript/native, so a 7.x bump of this alias key is wrong.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: compromised versions are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
