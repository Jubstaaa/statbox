name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            image_tag:
                description: 'Rollback: redeploy an existing image by its full 40-char commit SHA. Empty builds and deploys HEAD.'
                required: false
                default: ''
                type: string
            restore_snapshot:
                description: 'Rollback only: also put back the newest cache snapshot taken while image_tag was running, discarding every cache write since.'
                required: false
                default: false
                type: boolean

permissions:
    contents: read

env:
    IMAGE: ghcr.io/jubstaaa/statbox

jobs:
    ci:
        if: ${{ !inputs.image_tag }}
        uses: ./.github/workflows/ci.yml
        with:
            run-check: false
        permissions:
            contents: read
            packages: write

    deploy:
        environment: Production
        needs: ci
        if: ${{ !cancelled() && (inputs.image_tag || needs.ci.result == 'success') }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        permissions:
            contents: read
            packages: write
        env:
            IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        steps:
            - name: Validate the tag
              run: '[[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full 40-char commit SHA"; exit 1; }'
            - name: Refuse a snapshot restore without a rollback tag
              if: ${{ inputs.restore_snapshot && !inputs.image_tag }}
              run: '{ echo "::error::restore_snapshot needs image_tag: it restores the snapshot taken while that tag was running"; exit 1; }'
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.IMAGE_TAG }}
                  persist-credentials: false
                  sparse-checkout: docker-compose.yml
                  sparse-checkout-cone-mode: false
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Confirm the image exists
              run: docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" > /dev/null
            - uses: Jubstaaa/deploy-actions/ssh@fc838276e9a31bd2d7726ad0d2b1f6df8e62b1a8 # v2.4.0
              with:
                  host: ${{ secrets.DO_HOST }}
                  user: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  known-hosts: ${{ secrets.DO_KNOWN_HOSTS }}
            - uses: Jubstaaa/deploy-actions/compose@fc838276e9a31bd2d7726ad0d2b1f6df8e62b1a8 # v2.4.0
              with:
                  app-dir: /opt/statbox
                  container: statbox
                  image: ${{ env.IMAGE }}
                  tag: ${{ env.IMAGE_TAG }}
                  health-url: http://127.0.0.1:3003/
                  sqlite-snapshot: /opt/statbox/data/statbox-cache.db
                  keep-snapshots: '3'
                  restore-snapshot: ${{ inputs.restore_snapshot && 'true' || 'false' }}

    alert:
        needs: [ci, deploy]
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Open or update the deploy-failure issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  TITLE: Production deploy failed
              run: |
                  body="Run: $RUN_URL (commit $GITHUB_SHA). Production may be on the previous release or down; check the deploy log."
                  gh label create deploy-failure --force --color B60205 \
                      --description 'Opened by the deploy workflow'
                  existing=$(gh issue list --state open --author app/github-actions \
                      --label deploy-failure --search "\"$TITLE\" in:title" \
                      --json number,author \
                      --jq '[.[] | select(.author.is_bot and .author.login == "app/github-actions")][0].number // empty')
                  if [ -n "$existing" ]; then
                      gh issue comment "$existing" --body "$body"
                  else
                      gh issue create --title "$TITLE" --body "$body" --label deploy-failure
                  fi
