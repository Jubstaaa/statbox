name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            image_tag:
                description: 'Rollback: redeploy an existing image by its full 40-char commit SHA. Empty builds and deploys HEAD.'
                required: false
                default: ''
                type: string

permissions:
    contents: read

env:
    IMAGE: ghcr.io/jubstaaa/statbox

jobs:
    # Builds, smoke tests and pushes the image. The check job is not re-run: the
    # ruleset requires up-to-date branches, so this tree already passed it on
    # the PR. A rollback skips both: that SHA passed them when it was built.
    ci:
        if: ${{ !inputs.image_tag }}
        uses: ./.github/workflows/ci.yml
        with:
            run-check: false
        permissions:
            contents: read
            packages: write

    deploy:
        # Deploy secrets live in this environment, which only accepts main,
        # so a workflow on another branch cannot read them.
        environment: Production
        needs: ci
        if: ${{ !cancelled() && (inputs.image_tag || needs.ci.result == 'success') }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Never cancel a deploy halfway through `compose up`.
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        permissions:
            contents: read
            packages: write
        env:
            IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        steps:
            - name: Validate the tag
              run: '[[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full 40-char commit SHA"; exit 1; }'
            # The compose file comes from the commit being released, not from
            # this workflow's ref: the image job tested that image with that
            # file, and a rollback to an older SHA must run under the compose
            # file (and healthcheck) it shipped with, not main's.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.IMAGE_TAG }}
                  persist-credentials: false
                  sparse-checkout: docker-compose.yml
                  sparse-checkout-cone-mode: false
            # For promoting :latest once the release is healthy.
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Confirm the image exists
              run: docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" > /dev/null
            - uses: Jubstaaa/deploy-actions/ssh@233419e4b4936a17bf710cb7038f7dbc23a8a5f5 # v1.4.0
              with:
                  host: ${{ secrets.DO_HOST }}
                  user: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  known-hosts: ${{ secrets.DO_KNOWN_HOSTS }}
            # Snapshots the SQLite cache before the new tag starts and puts it back
            # if the release is rolled back.
            - uses: Jubstaaa/deploy-actions/compose@233419e4b4936a17bf710cb7038f7dbc23a8a5f5 # v1.4.0
              with:
                  app-dir: /opt/statbox
                  container: statbox
                  image: ${{ env.IMAGE }}
                  tag: ${{ env.IMAGE_TAG }}
                  # Lives in this workflow, not in the released commit, so it
                  # must be a path every image answers: the action probes it
                  # after starting the new tag and again after an automatic
                  # rollback to the previous one. The cache check is the
                  # compose healthcheck's job, which travels with each SHA.
                  health-url: http://127.0.0.1:3003/
                  sqlite-snapshot: /opt/statbox/data/statbox-cache.db
                  # The cache is about 120 MB and rebuildable; three is enough to
                  # step back across a bad release or two.
                  keep-snapshots: '3'
