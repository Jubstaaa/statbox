name: CI

on:
    pull_request:
    workflow_call:
        inputs:
            run-check:
                description: >-
                    Run the check job. The deploy turns it off: protect-main requires
                    branches to be up to date, so the merge commit has the tree the
                    PR's check already passed.
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    IMAGE: ghcr.io/jubstaaa/statbox

jobs:
    check:
        if: ${{ github.event_name == 'pull_request' || inputs.run-check }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Trivy (vulnerabilities, secrets, misconfiguration)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              env:
                  TRIVY_INCLUDE_DEV_DEPS: true
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,secret,misconfig
                  severity: HIGH,CRITICAL
                  exit-code: '1'
                  cache-dir: ${{ runner.temp }}/trivy
            - uses: ./.github/actions/setup-bun
            - run: bun run format:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build
              env:
                  RIOT_API_KEY: build-time-placeholder
                  NEXT_TELEMETRY_DISABLED: '1'
            - run: bun run audit
            - name: Dead code and unused dependencies (knip)
              run: bun run knip
            - name: Duplication (jscpd)
              run: bun run jscpd
            - name: Module graph (dependency-cruiser)
              run: bun run depcruise
            - name: actionlint
              run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

    image:
        if: ${{ github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/smoke-image
              with:
                  image: ${{ env.IMAGE }}
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Rollback rehearsal
              env:
                  IMAGE_TAG: latest
                  DATA_DIR: ${{ runner.temp }}/data
                  IMAGE_CACHE_DIR: ${{ runner.temp }}/image-cache
                  HEALTH_URL: http://127.0.0.1:3003/
              run: |
                  docker pull --quiet "$IMAGE:$IMAGE_TAG"
                  docker compose up -d --wait --wait-timeout 120 app
                  curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" > /dev/null
            - name: Rollback logs
              if: failure()
              env:
                  IMAGE_TAG: latest
              run: docker compose logs app

    release-image:
        if: ${{ github.event_name != 'pull_request' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/smoke-image
              with:
                  image: ${{ env.IMAGE }}
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Push the SHA tag
              run: docker push "$IMAGE:$GITHUB_SHA"
