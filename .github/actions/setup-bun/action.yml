name: Set up Bun and Node
description: Install the Node range from engines.node, the Bun version pinned in package.json and the locked dependencies.
runs:
    using: composite
    steps:
        # next, vitest and tsc start through `#!/usr/bin/env node`, so without
        # this they would run on whichever Node the runner image ships.
        - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version-file: package.json
        - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
          with:
              bun-version-file: package.json
        - run: bun install --frozen-lockfile
          shell: bash
