services:
    app:
        image: ghcr.io/jubstaaa/statbox:${IMAGE_TAG:-latest}
        container_name: statbox
        restart: unless-stopped
        mem_limit: 256m
        pids_limit: 128
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'
        #
        #
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q -O /dev/null -T 3 http://127.0.0.1:3000/api/health || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 40s
            start_interval: 2s
        env_file: .env
        #
        #
        ports:
            - '127.0.0.1:3003:3000'
        environment:
            NODE_ENV: production
            HOSTNAME: 0.0.0.0
            NODE_OPTIONS: --max-old-space-size=128
            CACHE_DATABASE_URI: file:/app/data/statbox-cache.db
        volumes:
            - ${DATA_DIR:-/opt/statbox/data}:/app/data
            - ${IMAGE_CACHE_DIR:-/opt/statbox/cache/images}:/app/.next/cache/images
