# Runtime stack on the droplet (/opt/statbox). Published only on localhost:3003;
# the shared Caddy in /opt/proxy terminates TLS and reverse-proxies to it, next to
# the other apps. The image is pulled from GHCR by the deploy workflow.
services:
    app:
        # The deploy job sets IMAGE_TAG to the commit SHA it releases; :latest moves
        # only after a healthy deploy, so the fallback is the last good release.
        image: ghcr.io/jubstaaa/statbox:${IMAGE_TAG:-latest}
        container_name: statbox
        restart: unless-stopped
        # Measured 109MB idle for the standalone server; 256m leaves room for
        # request spikes without letting it crowd the other apps.
        mem_limit: 256m
        pids_limit: 128
        # The root filesystem stays writable on purpose: pages revalidate daily
        # (the Data Dragon version), and Next writes regenerated pages under
        # .next/server. Everything else follows the shared hardening.
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'
        # next-server binds the container's own address rather than loopback, so the
        # probe has to resolve $HOSTNAME: wget against 127.0.0.1 gets connection
        # refused. The name is doubled so Compose passes the variable through to the
        # shell inside the container instead of substituting the host's value. wget
        # here is BusyBox — -T is the timeout, the GNU long options do not exist.
        #
        # Docker does not restart an unhealthy container, and Beszel
        # cannot alert per container, so this fills the Health column and nothing
        # more: it surfaces "process alive but application wedged", which the
        # restart policy alone never catches. Deploys also wait on it
        # (`compose up --wait`) and roll back when it never passes. /api/health
        # queries the SQLite cache, so an unreadable data mount fails it too.
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q -O /dev/null -T 3 "http://$$HOSTNAME:3000/api/health" || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 40s
            # Probe quickly while starting so a deploy's `compose up --wait` returns as
            # soon as the app answers instead of after the first 30s interval.
            start_interval: 2s
        env_file: .env
        # No third party has Portainer access to this app. If that changes, set
        # PORTAINER_TEAMS in .env beside this file and uncomment the two lines
        # below: the permission is then reapplied on every recreate.
        #
        # Doing it from the Portainer UI instead does NOT work — the permission
        # is keyed to the container ID, and `docker compose up -d` replaces the
        # container, so access silently disappears on the next deploy. Leaving
        # the label out entirely means administrator-only, which is the default
        # we want here.
        #
        # labels:
        #     io.portainer.accesscontrol.teams: ${PORTAINER_TEAMS}
        ports:
            - '127.0.0.1:3003:3000'
        environment:
            NODE_ENV: production
            # Keep V8's heap under the container limit so it collects garbage
            # before the cgroup OOM-kills the process.
            NODE_OPTIONS: --max-old-space-size=160
            # Persisted deliberately: match details are cached for 90 days and the
            # Riot API is rate limited, so an empty cache after a deploy costs quota.
            CACHE_DATABASE_URI: file:/app/data/statbox-cache.db
        # The defaults are the droplet's paths; CI's image job points both at
        # temporary directories to run this same file.
        volumes:
            - ${DATA_DIR:-/opt/statbox/data}:/app/data
            # Next's optimized output for the remote ddragon icons — without this a
            # deploy throws the whole set away and every icon is refetched.
            - ${IMAGE_CACHE_DIR:-/opt/statbox/cache/images}:/app/.next/cache/images
